<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sabaq AI — Кіру</title>
<link rel="icon" href="/img/logo.png">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/login.css">
</head>
<body>
<main class="login">
  <section class="login-form-side">
    <form class="login-card fade-up" id="login-form" novalidate>
      <div class="brand"><img src="/img/logo.png" alt=""><span style="font-size:19px">Sabaq AI</span></div>
      <div>
        <h1 style="font-size:26px;line-height:1.3">Қайта қош келдіңіз</h1>
        <div class="muted" style="font-size:14px;margin-top:6px">Жүйеге кіру үшін деректеріңізді енгізіңіз.</div>
      </div>

      <div class="role-tabs" role="tablist" aria-label="Кіру түрі">
        <button type="button" role="tab" class="role-tab" data-role="teacher" aria-selected="true">Мұғалім</button>
        <button type="button" role="tab" class="role-tab" data-role="admin" aria-selected="false">Әкімші</button>
      </div>

      <div>
        <label class="field-label" for="email">Электрондық пошта</label>
        <input class="field-input" id="email" type="email" autocomplete="username" placeholder="aigerim@sabaq.ai" required>
      </div>
      <div>
        <label class="field-label" for="password">Құпия сөз</label>
        <input class="field-input" id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>

      <div class="check-row">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="remember" checked> Есте сақтау</label>
        <button type="button" class="link-btn" id="forgot">Құпия сөзді ұмыттыңыз ба?</button>
      </div>

      <div class="form-error" id="error" role="alert"></div>

      <button class="btn-primary block" type="submit" id="submit">
        <span id="submit-label">Кіру</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <div class="muted" id="role-hint" style="font-size:13px;text-align:center">Аккаунтыңыз жоқ па? Мектеп әкімшісіне хабарласыңыз — аккаунтты тек әкімші ашады.</div>
    </form>
  </section>

  <section class="login-hero" aria-hidden="true">
    <div class="stars"></div>
    <div class="robot-scene">
      <div class="robot-glow"></div>
      <span class="note" style="left:40px;top:60px">♪</span>
      <span class="note" style="right:40px;top:40px;animation-delay:.8s">♫</span>
      <span class="note" style="left:70px;top:20px;animation-delay:1.6s">♪</span>
      <svg class="robot-svg" viewBox="0 0 140 220">
        <g class="robot-body-g">
          <g class="robot-antenna"><line x1="70" y1="10" x2="70" y2="30" stroke="#F7DFCB" stroke-width="4" stroke-linecap="round"/><circle cx="70" cy="9" r="7" fill="#E0733D"/></g>
          <rect x="28" y="28" width="84" height="62" rx="20" fill="#F4F1EA"/>
          <rect x="38" y="40" width="64" height="38" rx="13" fill="#1B2438"/>
          <circle class="robot-eye" cx="56" cy="58" r="6" fill="#7FE0D2"/>
          <circle class="robot-eye" cx="84" cy="58" r="6" fill="#7FE0D2"/>
          <path d="M60 70q10 6 20 0" stroke="#7FE0D2" stroke-width="3" fill="none" stroke-linecap="round"/>
          <rect x="62" y="90" width="16" height="8" fill="#C9C3B5"/>
          <rect x="34" y="96" width="72" height="70" rx="18" fill="#E0733D"/>
          <rect x="50" y="112" width="40" height="26" rx="6" fill="#F7DFCB"/>
          <text x="70" y="131" font-family="Times New Roman, serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1B2438">AI</text>
          <g class="robot-arm-l"><rect x="14" y="100" width="16" height="50" rx="8" fill="#F4F1EA"/><circle cx="22" cy="154" r="9" fill="#2F7D74"/></g>
          <g class="robot-arm-r"><rect x="110" y="100" width="16" height="50" rx="8" fill="#F4F1EA"/><circle cx="118" cy="154" r="9" fill="#2F7D74"/></g>
          <g class="robot-leg-l"><rect x="46" y="164" width="18" height="36" rx="8" fill="#F4F1EA"/><rect x="40" y="196" width="28" height="12" rx="6" fill="#2F7D74"/></g>
          <g class="robot-leg-r"><rect x="76" y="164" width="18" height="36" rx="8" fill="#F4F1EA"/><rect x="72" y="196" width="28" height="12" rx="6" fill="#2F7D74"/></g>
        </g>
      </svg>
      <div class="robot-shadow"></div>
    </div>
    <div class="hero-copy">
      <h2>AI-мұғалім көмекшісі</h2>
      <p>ҚМЖ, презентация және сабақ суреттерін бірнеше минутта дайындаңыз.</p>
      <div class="hero-pills"><span>ҚМЖ</span><span>Презентация</span><span>Сурет</span></div>
    </div>
  </section>
</main>
<script type="module" src="/js/login.js"></script>
</body>
</html>
