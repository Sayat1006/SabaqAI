<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b85a2a" />
    <title>AI Nur — интернет жоқ</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fbf7f0; color: #1c1b2e; font-family: "Times New Roman", Times, serif; text-align: center; padding: 24px; box-sizing: border-box; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 26px; margin: 18px 0 8px; }
      p { color: #6b6680; font-size: 16px; max-width: 360px; margin: 0 auto 22px; line-height: 1.5; }
      button { background: #b85a2a; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/img/logo.png" alt="" />
      <h1>Интернет байланысы жоқ</h1>
      <p>AI Nur жұмыс істеуі үшін интернет қажет. Байланысты тексеріп, қайта көріңіз.</p>
      <button type="button" onclick="location.reload()">Қайта жүктеу</button>
    </main>
  </body>
</html>
