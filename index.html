<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#b85a2a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AI Nur" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI Nur — мұғалімге арналған AI көмекші: ҚМЖ, презентация, сабақ суреттері, саралау деңгейлері бар тест және оқушыларға кері байланыс."
    />
    <script>
      // Түнгі режимді бет салынбай тұрып қолданамыз (ақ түстің жыпылықтауы болмас үшін).
      try {
        var t = localStorage.getItem("ainur-theme");
        if (t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {}
    </script>
    <title>AI Nur — мұғалімге арналған AI студия</title>
  </head>
  <body>
    <div id="root">
      <!-- JS жүктелгенше: ҚМЖ генерациясындағыдай айналатын жұлдызша (React бұны өз бетімен ауыстырады). -->
      <div role="status" aria-label="AI Nur" style="display:flex;min-height:100vh;align-items:center;justify-content:center">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#e0733d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation:ainur-spin 1s linear infinite">
          <path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" />
          <path d="M20 2v4" /><path d="M22 4h-4" /><circle cx="4" cy="20" r="2" />
        </svg>
      </div>
      <style>@keyframes ainur-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
