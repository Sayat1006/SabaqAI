<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<title>Профиль және рейтинг</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif;color:#111827;background:#FFFFFF}
a{color:#2563EB;text-decoration:none}a:hover{color:#1D4ED8}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #2563EB;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; display: flex; flex-direction: column; box-sizing: border-box">

<header style="display: flex; align-items: center; gap: 14px; padding: 20px 20px 8px">
<div style="width: 60px; height: 60px; border-radius: 50%; border: 3px solid #FFFFFF; box-shadow: 0 0 0 2px #C4B5FD; background: #EDE9FE; color: #5B21B6; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800">СА</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
<h1 style="margin: 0; font-size: 20px; font-weight: 800">Саят</h1>
<span style="font-size: 13px; color: #4B5563">11-сынып · 7-деңгей</span>
</div>
<button aria-label="Баптаулар" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #F3F4F6; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg></button>
</header>

<div style="margin: 12px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="padding: 12px; border-radius: 16px; background: #F3F4F6; display: flex; flex-direction: column; gap: 4px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EA580C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg><span style="font-size: 20px; font-weight: 800">12</span><span style="font-size: 12px; color: #4B5563">күн серия</span></div>
<div style="padding: 12px; border-radius: 16px; background: #F3F4F6; display: flex; flex-direction: column; gap: 4px"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{accent2}}"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg><span style="font-size: 20px; font-weight: 800">2 450</span><span style="font-size: 12px; color: #4B5563">ұпай</span></div>
<div style="padding: 12px; border-radius: 16px; background: #F3F4F6; display: flex; flex-direction: column; gap: 4px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round"><path d="M6 20v-6"></path><path d="M12 20V8"></path><path d="M18 20V4"></path></svg><span style="font-size: 20px; font-weight: 800">#4</span><span style="font-size: 12px; color: #4B5563">сыныпта</span></div>
</div>

<section style="margin: 16px 20px 0; padding: 16px; border: 1px solid #E5E7EB; border-radius: 22px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 800">Белсенділік</span><span style="font-size: 12px; color: #4B5563">Соңғы 4 апта</span></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; font-size: 11px; color: #4B5563; text-align: center"><span>Дс</span><span>Сс</span><span>Ср</span><span>Бс</span><span>Жм</span><span>Сб</span><span>Жс</span></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="28">
<div style="height: 30px; border-radius: 8px; background: {{d.c}}"></div>
</sc-for>
</div>
</section>

<div style="margin: 20px 20px 10px; display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 16px; font-weight: 800">Рейтинг</h2>
<div role="tablist" aria-label="Рейтинг ауқымы" style="display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: #F3F4F6">
<sc-for list="{{scopes}}" as="t" hint-placeholder-count="3">
<button role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="height: 32px; padding: 0 10px; border: 0; border-radius: 10px; background: {{t.bg}}; color: {{t.fg}}; font-size: 12px; font-weight: 700; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
</div>
<ol style="margin: 0 20px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{rank}}" as="r" hint-placeholder-count="5">
<li style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 12px; border-radius: 14px; background: {{r.bg}}; border: 1px solid {{r.bd}}">
<span style="width: 22px; font-size: 14px; font-weight: 800; color: #4B5563">{{r.pos}}</span>
<span style="width: 30px; height: 30px; border-radius: 50%; background: #EDE9FE; color: #5B21B6; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{r.ini}}</span>
<span style="flex-grow: 1; font-size: 14px; font-weight: 700">{{r.name}}</span>
<span style="font-size: 14px; font-weight: 700">{{r.pts}}</span>
</li>
</sc-for>
</ol>

<nav aria-label="Негізгі мәзір" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; box-sizing: border-box; padding: 10px 12px 18px; border-top: 1px solid #F3F4F6; background: #FFFFFF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<a href="Mobile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #6B7280"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Басты</a>
<a href="Unt.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #6B7280"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"></path><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"></path></svg>Сабақтар</a>
<a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #6B7280"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20v-6"></path><path d="M12 20V8"></path><path d="M18 20V4"></path></svg>Рейтинг</a>
<a href="Profile.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: {{accent}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Профиль</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2563EB"},"accent2":{"editor":"color","default":"#7C3AED"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { scope: 0 }; }
renderVals() {
const accent = this.props.accent ?? '#2563EB';
const accent2 = this.props.accent2 ?? '#7C3AED';
const lv = [0,1,2,1,0,0,1, 2,1,0,2,2,1,0, 1,2,2,1,2,3,2, 3,2,3,3,2,3,1];
const pal = ['#F3F4F6', '#C7D2FE', accent, accent2];
const R = [
[['Айгерім', 3120], ['Нұрлан', 2980], ['Дана', 2710], ['Саят', 2450], ['Ерасыл', 2300]],
[['Әлихан', 4210], ['Айгерім', 3120], ['Томирис', 3050], ['Нұрлан', 2980], ['Саят', 2450]],
[['Мадина', 6120], ['Әлихан', 4210], ['Арман', 4105], ['Жансая', 3990], ['Саят', 2450]]
][this.state.scope];
const pos = [[1,2,3,4,5],[1,2,3,4,11],[1,2,3,4,86]][this.state.scope];
return {
accent, accent2,
days: lv.map((l) => ({ c: pal[l] })),
scopes: ['Сынып', 'Мектеп', 'Қала'].map((label, i) => ({ label, sel: i === this.state.scope ? 'true' : 'false', bg: i === this.state.scope ? '#FFFFFF' : 'transparent', fg: i === this.state.scope ? '#111827' : '#4B5563', pick: () => this.setState({ scope: i }) })),
rank: R.map(([n, p], i) => { const me = n === 'Саят'; return { pos: pos[i], name: me ? 'Саят (сіз)' : n, ini: n.slice(0, 1), pts: p.toLocaleString('ru-RU').replace(/,/g, ' '), bg: me ? '#EFF6FF' : '#FFFFFF', bd: me ? '#BFDBFE' : '#F3F4F6' }; })
};
}
}
</script>
</body>
</html>
