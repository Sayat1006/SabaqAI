<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<title>ББЖМ (МОДО)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif;color:#111827;background:#FFFFFF}
a{color:#2563EB;text-decoration:none}a:hover{color:#1D4ED8}
button{font-family:inherit}
.cta:hover{background:#1F2937;color:#FFFFFF}
.row:hover{border-color:#C7D2FE}
button:focus-visible,a:focus-visible{outline:2px solid #2563EB;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; display: flex; flex-direction: column; box-sizing: border-box">

<header style="display: flex; align-items: center; gap: 12px; padding: 16px 20px 8px">
<a href="Mobile.dc.html" aria-label="Артқа" style="width: 44px; height: 44px; border-radius: 22px; background: #F3F4F6; display: flex; align-items: center; justify-content: center; color: #111827"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; font-size: 20px; font-weight: 800">ББЖМ (МОДО)</h1>
</header>

<p style="margin: 4px 20px 0; font-size: 14px; line-height: 1.45; color: #4B5563">Білім алушылардың білім жетістіктерін мониторингілеу 4 және 9-сыныпта функционалдық сауаттылықты тексереді.</p>

<div role="tablist" aria-label="Сынып" style="margin: 16px 20px 0; padding: 4px; border-radius: 16px; background: #F3F4F6; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{grades}}" as="g" hint-placeholder-count="2">
<button role="tab" aria-selected="{{g.sel}}" onClick="{{g.pick}}" style="height: 40px; border: 0; border-radius: 12px; background: {{g.bg}}; color: {{g.fg}}; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: {{g.sh}}">{{g.label}}</button>
</sc-for>
</div>

<section style="margin: 16px 20px 0; padding: 16px; background: #F3F4F6; border-radius: 22px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 800">Диагностика нәтижесі</span><span style="font-size: 12px; color: #4B5563">{{gradeLabel}}</span></div>
<div style="height: 110px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: end">
<sc-for list="{{areas}}" as="a" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="font-size: 13px; font-weight: 800">{{a.pct}}</span><div style="width: 56px; height: {{a.h}}; border-radius: 12px 12px 6px 6px; background: {{a.c}}"></div></div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; text-align: center; font-size: 12px; color: #4B5563"><span>Математика</span><span>Жаратылыстану</span><span>Оқу</span></div>
</section>

<h2 style="margin: 22px 20px 10px; font-size: 16px; font-weight: 800">Бағыттар</h2>
<div style="margin: 0 20px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{areas}}" as="a" hint-placeholder-count="3">
<a class="row" href="Test.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid #E5E7EB; border-radius: 18px; color: #111827">
<span style="width: 40px; height: 40px; border-radius: 12px; background: {{a.tint}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: {{a.ic}}">{{a.letter}}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{a.name}}</span><span style="font-size: 12px; color: #4B5563">{{a.meta}}</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 24px; background: #FFFFFF; border-top: 1px solid #F3F4F6">
<a class="cta" href="Test.dc.html" style="height: 52px; border-radius: 16px; background: #111827; color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">Диагностикалық тестті бастау</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2563EB"},"accent2":{"editor":"color","default":"#7C3AED"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { g: 1 }; }
renderVals() {
const accent = this.props.accent ?? '#2563EB';
const accent2 = this.props.accent2 ?? '#7C3AED';
const g = this.state.g;
const D = [[70, 55, 82], [48, 36, 61]][g];
const names = ['Математикалық сауаттылық', 'Жаратылыстану сауаттылығы', 'Оқу сауаттылығы'];
const done = [[6, 4, 8], [3, 2, 5]][g];
const cols = [accent, accent2, '#6366F1'];
return {
grades: ['4-сынып', '9-сынып'].map((label, i) => ({ label, sel: i === g ? 'true' : 'false', bg: i === g ? '#FFFFFF' : 'transparent', fg: i === g ? '#111827' : '#4B5563', sh: i === g ? '0 1px 3px rgba(17,24,39,.12)' : 'none', pick: () => this.setState({ g: i }) })),
gradeLabel: g === 0 ? '4-сынып' : '9-сынып',
areas: D.map((v, i) => ({ pct: v + '%', h: Math.round(v * 0.85) + 'px', c: cols[i], name: names[i], letter: ['М', 'Ж', 'О'][i], tint: ['#EFF6FF', '#F5F3FF', '#EEF2FF'][i], ic: ['#1D4ED8', '#5B21B6', '#4338CA'][i], meta: done[i] + ' / 14 тақырып · ' + v + '%' }))
};
}
}
</script>
</body>
</html>
